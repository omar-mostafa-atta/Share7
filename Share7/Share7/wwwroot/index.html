<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In — Share7 Admin Console</title>
  <meta name="description" content="Sign in to the Share7 Admin Console to manage curriculum, games, shop, offers and currencies." />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- App styles -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <!-- Brand -->
      <div class="login-brand">
        <div class="login-brand-icon"><i class="bi bi-shield-lock"></i></div>
        <h1>Share7 Admin</h1>
        <p>Sign in with an <code>Admin</code> or <code>SuperAdmin</code> account.</p>
      </div>

      <!-- Form -->
      <form id="loginForm" autocomplete="on">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input id="username" name="username" class="form-control" autocomplete="username"
                 value="admin" placeholder="Enter your username" />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" type="password" class="form-control" autocomplete="current-password"
                 value="Admin123" placeholder="Enter your password" />
        </div>

        <div class="mb-3">
          <label for="langSelect" class="form-label">Content language</label>
          <select id="langSelect" class="form-select">
            <option value="">Loading languages…</option>
          </select>
        </div>

        <button type="submit" class="login-btn" id="btnLogin">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>

        <div class="login-error" id="loginError"></div>
      </form>

      <div class="login-version">
        Served by the API itself — every call is same-origin.
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import state, { save, isSignedIn } from './js/state.js';
    import { signIn } from './js/auth.js';
    import { loadLanguages } from './js/api.js';

    // If already signed in, go straight to curriculum
    if (isSignedIn()) {
      window.location.href = 'pages/curriculum.html';
    }

    // Load languages for the select box
    try {
      await loadLanguages(['langSelect']);
    } catch {
      // Server may be unreachable — the form still works, language will default
    }

    // Handle form submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('btnLogin');
      const errorBox = document.getElementById('loginError');
      errorBox.classList.remove('show');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Signing in…';

      try {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        // Save selected language
        const langId = document.getElementById('langSelect').value;
        if (langId) {
          state.selectedLangId = langId;
          save();
        }

        await signIn(username, password);

        // Redirect to dashboard
        window.location.href = 'pages/curriculum.html';
      } catch (err) {
        errorBox.textContent = err.message || 'Sign-in failed. Check credentials and try again.';
        errorBox.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
      }
    });
  </script>
</body>
</html>
